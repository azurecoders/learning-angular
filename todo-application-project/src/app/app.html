<main
  class="min-h-screen flex items-center justify-center bg-linear-to-b from-blue-500 to-blue-400"
>
  <div class="bg-white p-4 rounded-lg w-170">
    <div class="flex items-center gap-2">
      <input
        type="text"
        class="w-full border border-neutral-400 rounded-md px-4 py-4 text-xl"
        placeholder="Enter your todo..."
        [(ngModel)]="todoField"
      />
      <button
        class="h-full bg-blue-400 text-white py-4.25 px-6 text-lg font-semibold rounded-md hover:opacity-80 transition-all duration-300 ease-in-out cursor-pointer"
        (click)="createTodo()"
      >
        Create
      </button>
    </div>

    <div class="mt-6 space-y-4">
      @for (todo of todos(); track todo.id) {
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <input
              (change)="toggleCompletion(todo.id)"
              type="checkbox"
              name=""
              id=""
              class="w-5 h-5"
            />
            <p
              class="text-2xl"
              [style.textDecoration]="!todo.isCompleted ? 'line-through' : 'none'"
            >
              {{ todo.text }}
            </p>
          </div>
          <div>
            <ng-icon
              (click)="deleteTodo(todo.id)"
              size="20"
              color="red"
              style="cursor: pointer"
              name="lucideTrash2"
            ></ng-icon>
          </div>
        </div>
      }
    </div>
  </div>
</main>
