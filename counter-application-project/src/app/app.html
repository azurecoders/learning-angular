<main class="h-screen flex items-center justify-center">
  <div class="shadow-md w-130 p-8 rounded-lg">
    <h2 class="text-4xl text-center my-12 font-semibold">Counter App</h2>
    <p class="text-7xl font-semibold text-center my-8">{{ count() }}</p>
    <div class="flex items-center justify-between gap-4">
      <button
        class="bg-blue-500 text-3xl text-white w-full py-2 rounded-md hover:opacity-90 transition-all duration-300 ease-in-out cursor-pointer"
        (click)="updateCount('inc')"
      >
        +
      </button>
      <button
        [disabled]="disabledReset()"
        class="bg-neutral-900 text-xl text-white w-full py-3 rounded-md hover:opacity-90 transition-all duration-300 ease-in-out cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
        (click)="updateCount('reset')"
      >
        Reset
      </button>
      <button
        [disabled]="disabledDec()"
        class="bg-blue-500 text-3xl text-white w-full py-2 rounded-md hover:opacity-90 transition-all duration-300 ease-in-out cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed"
        (click)="updateCount('dec')"
      >
        -
      </button>
    </div>
  </div>
</main>
