<h1>User List</h1>

<ul>
  @for (user of usersData(); track user.id) {
    <ul class="product-ul">
      <li>Id: {{ user.id }}</li>
      <li>Name: {{ user.name | titlecase }}</li>
      <li>Age: {{ user.age }}</li>
      <li>Email: {{ user.email }}</li>
      <div style="display: flex; gap: 20px; align-items: center">
        <li><button (click)="deleteUser(user.id)">Delete</button></li>
        <li><button (click)="editUser(user.id)">Edit</button></li>
      </div>
    </ul>
  }
</ul>
